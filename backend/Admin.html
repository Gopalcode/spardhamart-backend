<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <nav class="top-nav">

    <div class="nav-left">
      <h3>Admin Panel</h3>
    </div>
  
    <div class="nav-right">
      <button onclick="showSection('add')">Add Classes</button>
      <button onclick="showSection('manage')">Manage Data</button>
    </div>
  
  </nav>
<h2 class="main-h2">Admin Side Pannel</h2>
<div id="addSection">
  <!-- तुझा existing container code -->
  <div class="container">
    <!-- LEFT FORM -->
    <div class="form-section">
  
      <!-- 🔹 TABS -->
      <div class="tabs">
        <button onclick="showTab('class')">Classes</button>
        <button onclick="showTab('book')">Books</button>
        <button onclick="showTab('test')">Test Series</button>
      </div>
  
      <!-- 🔸 CLASS FORM -->
      <div id="classForm" class="classForm">
        <h2 class="h2">Add Class Details</h2>
  
        <input type="text" id="className" placeholder="Class Name">
        <input type="file" id="imageFile" accept="image/*">
        <img id="previewImg" width="150" style="display: none;" />
        <input type="file" id="imageFile2" accept="image/*">
        <img id="previewImg2" width="150" style="display: none;" />            
        <input type="text" id="educator" placeholder="Educator Name">
        <input type="text" id="exam" placeholder="Enter Exam">
        <input type="text" id="subject" placeholder="Enter Subject">
        <input type="text" id="appName" placeholder="App Name">
        <input type="text" id="books" placeholder="Books">
        <input type="text" id="offer" placeholder="MobileNo">
        <input type="text" id="applink" placeholder="App link">

  
        <input type="text" id="demoVideo" placeholder="Demo Lecture">
        <input type="text" id="yt" placeholder="YouTube Link">
        <input type="text" id="tg" placeholder="Telegram Link">
        <input type="text" id="wa" placeholder="WhatsApp Link">
        <input type="text" id="ig" placeholder="Instagram Link">
        <input type="text" id="io" placeholder="ios Link">
        <input type="text" id="wb" placeholder="website Link">

  
        <button id="submitBtn" onclick="addClass()">Add Class</button>
      </div>
      <!-- 🔸 BOOK FORM -->
<!-- 🔸 BOOK FORM -->
<div id="bookForm" class="classForm">
  <h2 class="h2">Add Book Details</h2>

  <input type="text" id="b_className" placeholder="Store Name" oninput="updatePreview()">

  <input type="file" id="b_imageFile" accept="image/*" onchange="previewImage(event)">

  <input type="text" id="b_educator" placeholder="Motoo" oninput="updatePreview()">
  
  <input type="text" id="b_bookName" placeholder="delivery option" oninput="updatePreview()">
  
  <input type="text" id="b_price" placeholder="Payment Service" oninput="updatePreview()">
  
  <input type="text" id="b_rating" placeholder="suppot@" oninput="updatePreview()">
  
  <input type="text" id="b_bookLink" placeholder="Book Link" oninput="updatePreview()">

  <input type="text" id="b_call" placeholder="Call">
  <input type="text" id="b_yt" placeholder="YouTube Link">
  <input type="text" id="b_tg" placeholder="Telegram Link">
  <input type="text" id="b_wa" placeholder="WhatsApp Link">
  <input type="text" id="b_ig" placeholder="Instagram Link">
  <input type="text" id="b_io" placeholder="Mail">


  <button onclick="addBook()">Add Book</button>
</div>
  
      <!-- 🔸 TEST SERIES FORM -->
      <div id="testForm" class="classForm">
        <h2 class="h2">Add Test Series</h2>
  
        <input type="text" id="t_className" placeholder="Class Name">
        <input type="file" id="t_imageFile" accept="image/*">
        <input type="text" id="t_exam" placeholder="Exam Name">
        <input type="text" id="t_subject" placeholder="Enter Subject">
        <input type="text" id="t_appName" placeholder="App Name">
        <input type="text" id="t_offer" placeholder="Offer Code">
        <input type="text" id="t_call" placeholder="MobileNo">
        <input type="text" id="t_applink" placeholder="App link">


        <input type="text" id="t_yt" placeholder="YouTube Link">
        <input type="text" id="t_tg" placeholder="Telegram Link">
        <input type="text" id="t_wa" placeholder="WhatsApp Link">
        <input type="text" id="t_ig" placeholder="Instagram Link">
        <input type="text" id="t_io" placeholder="ios Link">
        <input type="text" id="t_wb" placeholder="website Link">

  
        <button onclick="addTest()">Add Test</button>
      </div>
  
    </div>
  
    <!-- RIGHT CARD -->
    <div class="card-section">
      <div class="card-plan">
        <div class="classname">
  
          <span id="clsname" class="span-center">Title</span><br>
  
          <img id="cardImg" src="" alt="Your Image will appear here" style="max-width:300px; margin-top:10px;">
  
          <ul>                        
            <li class="list-card"><i class="fa-solid fa-chalkboard-user"></i> <span id="eduname">---</span></li>
            <li class="list-card"><i class="fa-solid fa-mobile-screen-button"></i> <span id="appname">---</span></li>
            <li class="list-card"><i class="fa-solid fa-book"></i> <span id="bookname">---</span></li>
            <li class="list-card"><i class="fa-solid fa-tag"></i> <span id="offername">---</span></li>
            <li class="list-card"><i class="fa-solid fa-mobile-screen-button"></i> <span id="app">---</span></li>
  
          </ul>
  
          <div class="social-card">
            <a id="ytlink" href="#" class="icon youtube"><i class="fa-brands fa-youtube"></i></a>
            <a id="tglink" href="#" class="icon telegram"><i class="fa-brands fa-telegram"></i></a>
            <a id="walink" href="#" class="icon whatsapp"><i class="fa-brands fa-whatsapp"></i></a>
            <a id="iolink" href="#" class="icon ios"><i class="fa-brands fa-apple"></i></a>
            <a id="wblink" href="#" class="icon web"><i class="fa-brands fa-globe"></i></a>

          </div>
  
        </div>
      </div>
    </div>
  
  </div>
</div>
<div id="manageSection" style="display:none; padding:20px; overflow-x: auto;">

  <h2>Manage Classes</h2>

  <table border="1" width="100%">
    <thead>
      <tr>
        <th>ClassName</th>
        <th>Image</th>
        <th>EducatorName</th>
        <th>AppName</th>
        <th>Books</th>
        <th>OfferCode</th>
        <th>AppLink</th>
        <th>YouTubelink</th>
        <th>Demolink</th>
        <th>Telegramlink</th>
        <th>What'sApplink</th>
        <th>Ios Link</th>
        <th>Web Link</th>
        <th>Action</th>

      </tr>
    </thead>

    <tbody id="tableBody"></tbody>
  </table>

</div>

<script src="./admin.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
